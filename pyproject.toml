[project]
name = "opspilot"
version = "0.1.0"
description = "AI on-call engineer: investigate incidents, propose safe fixes, verify recovery."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic>=0.40"]

[project.scripts]
opspilot = "opspilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opspilot*", "testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: records a live scenario against real local processes (~30s)"]
