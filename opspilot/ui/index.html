<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsPilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c9cff'/%3E%3Cpath d='M7 17h5l3-8 4 14 3-6h3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h5l3-8 4 16 3-8h5"/></svg></div>
      <div>OpsPilot<small>AI on-call engineer</small></div>
    </div>
    <a class="item" href="#/" data-nav="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
    <a class="item" href="#/incidents" data-nav="incidents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>Incidents<span class="badge" id="navBadge" hidden>0</span></a>
    <a class="item" href="#/benchmark" data-nav="benchmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Benchmark</a>
    <a class="item" href="#/scenarios" data-nav="scenarios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/></svg>Scenarios</a>
    <div class="foot">
      <div class="chain" title="SHA-256 hash chain over every audit entry"><span class="dot" id="chainDot"></span><span id="chainTxt">audit chain…</span></div>
      <div id="llmTxt" class="mut"></div>
      <button class="theme" id="themeBtn">Toggle theme</button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="sp"></div>
      <button class="btn pri" id="newBtn">＋ New incident</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
